<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Русский Город Ижевск - 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; background: #1a2a3a; }
        #info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-shadow: 1px 1px 8px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            font-size: 1.2rem;
            padding: 8px 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            white-space: nowrap;
            font-weight: 500;
            letter-spacing: 1px;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 20;
        }
        .ctrl-group {
            display: flex;
            gap: 18px;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(20, 25, 35, 0.75);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: 0.08s ease;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            cursor: pointer;
        }
        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.90);
            border-color: #ffcc44;
            box-shadow: 0 0 30px rgba(255, 200, 50, 0.3);
        }
        #forward { background: rgba(0, 160, 255, 0.5); border-color: rgba(100, 200, 255, 0.7); }
        #back { background: rgba(255, 100, 100, 0.5); border-color: rgba(255, 150, 150, 0.7); }
        #left { background: rgba(255, 200, 0, 0.5); border-color: rgba(255, 230, 100, 0.7); }
        #right { background: rgba(0, 220, 150, 0.5); border-color: rgba(100, 255, 200, 0.7); }
        @media (max-width: 600px) {
            .ctrl-btn { width: 65px; height: 65px; font-size: 28px; }
            #info { font-size: 0.9rem; padding: 5px 15px; }
        }
        @media (max-width: 420px) {
            .ctrl-btn { width: 55px; height: 55px; font-size: 22px; }
            .ctrl-group { gap: 12px; }
            #controls { padding: 0 12px; bottom: 20px; }
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 28px;
            pointer-events: none;
            z-index: 15;
            text-shadow: 0 0 15px rgba(0,0,0,0.9);
            font-weight: 100;
            opacity: 0.7;
        }
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a2a3a 0%, #0d1a2b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            z-index: 100;
            transition: opacity 0.8s ease;
            gap: 20px;
        }
        #loading span {
            font-size: 1rem;
            opacity: 0.6;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #88ccff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div>🏠</div>
        <div class="loading-spinner"></div>
        <span>Русский Город Ижевск</span>
    </div>
    <div id="info">🏘️ Ижевск • Прогулка</div>
    <div id="crosshair">✦</div>
    <div id="controls">
        <div class="ctrl-group">
            <div class="ctrl-btn" id="left">◀</div>
            <div class="ctrl-btn" id="right">▶</div>
        </div>
        <div class="ctrl-group">
            <div class="ctrl-btn" id="forward">▲</div>
            <div class="ctrl-btn" id="back">▼</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Инициализация ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7EC8E3);
        scene.fog = new THREE.Fog(0x7EC8E3, 15, 25);

        // КАМЕРА - уменьшили рост (1.2 вместо 1.7), чтобы дома казались больше
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(0, 1.2, 6);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0x8899bb, 0.5);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.4);
        sunLight.position.set(15, 25, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        const d = 25;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 40;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);
        
        const fillLight = new THREE.DirectionalLight(0xccddff, 0.3);
        fillLight.position.set(-15, 10, -10);
        scene.add(fillLight);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a7d3a, 0.4);
        scene.add(hemiLight);

        // --- Земля ---
        const groundGeometry = new THREE.PlaneGeometry(40, 40);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x5a8c5a, 
            roughness: 0.9,
            metalness: 0.0
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Дороги ---
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.95 });
        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.9 });
        
        const roads = [
            { x: 0, z: -4, w: 8, h: 0.6 },
            { x: 0, z: 4, w: 8, h: 0.6 },
            { x: -4, z: 0, w: 0.6, h: 8 },
            { x: 4, z: 0, w: 0.6, h: 8 }
        ];
        roads.forEach(r => {
            const road = new THREE.Mesh(new THREE.PlaneGeometry(r.w, r.h), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(r.x, 0.001, r.z);
            road.receiveShadow = true;
            scene.add(road);
        });

        // Бордюры
        const curbMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.8 });
        for (let i = -4; i <= 4; i+=0.8) {
            if (Math.abs(i) < 0.1) continue;
            // Вертикальные бордюры
            const curb1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.5), curbMat);
            curb1.position.set(i, 0.04, -3.7);
            scene.add(curb1);
            const curb2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.5), curbMat);
            curb2.position.set(i, 0.04, 3.7);
            scene.add(curb2);
            // Горизонтальные
            const curb3 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.1), curbMat);
            curb3.position.set(-3.7, 0.04, i);
            scene.add(curb3);
            const curb4 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.1), curbMat);
            curb4.position.set(3.7, 0.04, i);
            scene.add(curb4);
        }

        // --- Функция создания домика ---
        function createHouse(x, z, color = 0xcc8844, roofColor = 0x8b3a3a, width = 1.4, depth = 1.4, height = 1.2) {
            const group = new THREE.Group();

            // Стены
            const wallMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
            const wall = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), wallMat);
            wall.position.y = height/2;
            wall.castShadow = true;
            wall.receiveShadow = true;
            group.add(wall);

            // Крыша
            const w2 = width/2 + 0.25;
            const hRoof = height * 0.7;
            const roofShape = new THREE.Shape();
            roofShape.moveTo(-w2, 0);
            roofShape.lineTo(0, hRoof);
            roofShape.lineTo(w2, 0);
            roofShape.lineTo(-w2, 0);
            
            const extrudeSettings = { depth: depth + 0.25, bevelEnabled: false };
            const roofGeom = new THREE.ExtrudeGeometry(roofShape, extrudeSettings);
            const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.85 });
            const roof = new THREE.Mesh(roofGeom, roofMat);
            roof.position.set(0, height, -depth/2 - 0.125);
            roof.castShadow = true;
            roof.receiveShadow = true;
            group.add(roof);

            // Труба
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0x884444, roughness: 0.8 });
            const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.4, 8), pipeMat);
            pipe.position.set(0.3, height + 0.2, 0.25);
            pipe.castShadow = true;
            group.add(pipe);

            // Окна
            const windowMat = new THREE.MeshStandardMaterial({ 
                color: 0x88ddff, 
                emissive: 0x224466, 
                emissiveIntensity: 0.15,
                roughness: 0.1,
                metalness: 0.3
            });
            
            // Переднее окно
            const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.4, 0.05), windowMat);
            win1.position.set(0, height*0.6, depth/2 + 0.01);
            group.add(win1);
            
            // Рама окна
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
            const frame1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.02, 0.02), frameMat);
            frame1.position.set(0, height*0.6, depth/2 + 0.03);
            group.add(frame1);
            const frame2 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.45, 0.02), frameMat);
            frame2.position.set(0, height*0.6, depth/2 + 0.03);
            group.add(frame2);

            // Боковое окно
            const win2 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.4, 0.05), windowMat);
            win2.position.set(width/2 + 0.01, height*0.6, 0);
            win2.rotation.y = Math.PI/2;
            group.add(win2);

            // Крыльцо
            const stepMat = new THREE.MeshStandardMaterial({ color: 0x8b6b4b, roughness: 0.9 });
            const step = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.35), stepMat);
            step.position.set(0, 0.04, depth/2 + 0.18);
            step.castShadow = true;
            step.receiveShadow = true;
            group.add(step);

            // Столбы крыльца
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0xccbbaa });
            for (let side = -1; side <= 1; side+=2) {
                const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.25, 6), pillarMat);
                pillar.position.set(side*0.25, 0.16, depth/2 + 0.15);
                pillar.castShadow = true;
                group.add(pillar);
            }

            group.position.set(x, 0, z);
            group.rotation.y = (Math.random() - 0.5) * 0.6;
            return group;
        }

        // --- Создаём город ---
        const houseColors = [0xcc8844, 0xaa7744, 0xbb9966, 0x8b6b4b, 0x996633, 0xad8a5a, 0xc49a6c, 0xbf8f5a];
        const roofColors = [0x8b3a3a, 0x6b2a2a, 0x9b4a4a, 0x7a3a3a, 0x5a2a2a, 0xaa4a4a];
        
        const housePositions = [
            // Центральная площадь
            [-3, -3], [3, -3], [-3, 3], [3, 3],
            [-5.5, -2], [5.5, -2], [-5.5, 2], [5.5, 2],
            [-2, -5.5], [2, -5.5], [-2, 5.5], [2, 5.5],
            // Вокруг
            [-7, -4], [7, -4], [-7, 4], [7, 4],
            [-4.5, -7], [4.5, -7], [-4.5, 7], [4.5, 7],
            [0, -8], [0, 8], [-8, 0], [8, 0],
            // Дополнительные
            [-6.5, -5.5], [6.5, -5.5], [-6.5, 5.5], [6.5, 5.5],
            [-9, -2], [9, -2], [-9, 2], [9, 2],
            [-2, -9], [2, -9], [-2, 9], [2, 9]
        ];

        housePositions.forEach(([x, z]) => {
            const color = houseColors[Math.floor(Math.random() * houseColors.length)];
            const roofColor = roofColors[Math.floor(Math.random() * roofColors.length)];
            const w = 1.0 + Math.random() * 0.8;
            const d = 1.0 + Math.random() * 0.8;
            const h = 0.9 + Math.random() * 0.7;
            const house = createHouse(x, z, color, roofColor, w, d, h);
            scene.add(house);
        });

        // --- Деревья ---
        function createTree(x, z) {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b6b4b, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 0.5, 6), trunkMat);
            trunk.position.y = 0.25;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            group.add(trunk);

            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d7d2d, roughness: 0.8 });
            const leaf1 = new THREE.Mesh(new THREE.SphereGeometry(0.32, 6), leafMat);
            leaf1.position.y = 0.6;
            leaf1.castShadow = true;
            leaf1.receiveShadow = true;
            group.add(leaf1);
            
            const leaf2 = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6), leafMat);
            leaf2.position.y = 0.85;
            leaf2.castShadow = true;
            leaf2.receiveShadow = true;
            group.add(leaf2);

            group.position.set(x, 0, z);
            return group;
        }

        for (let i = 0; i < 50; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 1.5 + Math.random() * 9;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            // Не ставить на дороги и рядом с центром
            if (Math.abs(x) < 1.2 && Math.abs(z) < 1.2) continue;
            if (Math.abs(x) < 0.8 || Math.abs(z) < 0.8) continue;
            // Не ставить слишком близко к домам
            let tooClose = false;
            for (const pos of housePositions) {
                if (Math.sqrt((x - pos[0])**2 + (z - pos[1])**2) < 1.0) {
                    tooClose = true;
                    break;
                }
            }
            if (tooClose) continue;
            const tree = createTree(x, z);
            scene.add(tree);
        }

        // --- Фонари (для атмосферы) ---
        function createLamp(x, z) {
            const group = new THREE.Group();
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.6, roughness: 0.4 });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.6), poleMat);
            pole.position.y = 0.3;
            pole.castShadow = true;
            group.add(pole);
            
            const lampMat = new THREE.MeshStandardMaterial({ color: 0xffeecc, emissive: 0xffaa44, emissiveIntensity: 0.3 });
            const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8), lampMat);
            lamp.position.y = 0.65;
            lamp.castShadow = true;
            group.add(lamp);
            
            group.position.set(x, 0, z);
            return group;
        }

        const lampPositions = [
            [-2.5, -2.5], [2.5, -2.5], [-2.5, 2.5], [2.5, 2.5],
            [-5, -1.5], [5, -1.5], [-5, 1.5], [5, 1.5],
            [-1.5, -5], [1.5, -5], [-1.5, 5], [1.5, 5]
        ];
        lampPositions.forEach(([x, z]) => {
            const lamp = createLamp(x, z);
            scene.add(lamp);
        });

        // --- КОЛЛИЗИЯ (стены-невидимки вокруг домов) ---
        const collisionBoxes = [];
        
        // Добавляем коллизию для каждого дома
        housePositions.forEach(([x, z]) => {
            // Каждый дом имеет радиус ~0.8-1.2, делаем коллизию чуть больше
            const radius = 1.0 + Math.random() * 0.3;
            collisionBoxes.push({
                x: x,
                z: z,
                radius: radius
            });
        });

        // Добавляем коллизию для границ карты
        const mapLimit = 9.5;

        // --- Управление ---
        const keys = { forward: false, back: false, left: false, right: false };
        const moveSpeed = 0.08;
        const rotationSpeed = 0.035;

        // Проверка коллизии
        function checkCollision(newX, newZ) {
            // Границы карты
            if (newX < -mapLimit || newX > mapLimit || newZ < -mapLimit || newZ > mapLimit) {
                return true;
            }
            
            // Коллизия с домами
            const playerRadius = 0.3;
            for (const box of collisionBoxes) {
                const dx = newX - box.x;
                const dz = newZ - box.z;
                const distance = Math.sqrt(dx*dx + dz*dz);
                if (distance < box.radius + playerRadius) {
                    return true;
                }
            }
            return false;
        }

        // Движение с коллизией
        function movePlayer(dx, dz) {
            const newX = camera.position.x + dx;
            const newZ = camera.position.z + dz;
            
            // Проверяем движение по X и Z отдельно для скольжения вдоль стен
            if (!checkCollision(newX, camera.position.z)) {
                camera.position.x = newX;
            }
            if (!checkCollision(camera.position.x, newZ)) {
                camera.position.z = newZ;
            }
        }

        // --- Обработчики клавиатуры ---
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': case 'w': keys.forward = true; e.preventDefault(); break;
                case 'ArrowDown': case 's': keys.back = true; e.preventDefault(); break;
                case 'ArrowLeft': case 'a': keys.left = true; e.preventDefault(); break;
                case 'ArrowRight': case 'd': keys.right = true; e.preventDefault(); break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowUp': case 'w': keys.forward = false; e.preventDefault(); break;
                case 'ArrowDown': case 's': keys.back = false; e.preventDefault(); break;
                case 'ArrowLeft': case 'a': keys.left = false; e.preventDefault(); break;
                case 'ArrowRight': case 'd': keys.right = false; e.preventDefault(); break;
            }
        });

        // --- Кнопки для iPad (исправлено: назад = назад) ---
        function setupButton(id, key) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                keys[key] = true; 
                btn.classList.add('active');
            });
            btn.addEventListener('touchend', (e) => { 
                e.preventDefault(); 
                keys[key] = false; 
                btn.classList.remove('active');
            });
            btn.addEventListener('touchcancel', (e) => { 
                keys[key] = false; 
                btn.classList.remove('active');
            });
            // Для мыши (тестирование)
            btn.addEventListener('mousedown', (e) => { 
                keys[key] = true; 
                btn.classList.add('active');
            });
            btn.addEventListener('mouseup', (e) => { 
                keys[key] = false; 
                btn.classList.remove('active');
            });
            btn.addEventListener('mouseleave', (e) => { 
                keys[key] = false; 
                btn.classList.remove('active');
            });
        }

        setupButton('forward', 'forward');
        setupButton('back', 'back');
        setupButton('left', 'left');
        setupButton('right', 'right');

        // --- Ресайз ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Загрузка ---
        setTimeout(() => {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 800);
        }, 600);

        // --- Анимация ---
        function animate() {
            requestAnimationFrame(animate);

            // Поворот
            if (keys.left) camera.rotation.y += rotationSpeed;
            if (keys.right) camera.rotation.y -= rotationSpeed;

            // Движение (исправлено: назад = назад)
            if (keys.forward) {
                const dx = Math.sin(camera.rotation.y) * moveSpeed;
                const dz = Math.cos(camera.rotation.y) * moveSpeed;
                movePlayer(dx, dz);
            }
            if (keys.back) {
                const dx = -Math.sin(camera.rotation.y) * moveSpeed;
                const dz = -Math.cos(camera.rotation.y) * moveSpeed;
                movePlayer(dx, dz);
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
