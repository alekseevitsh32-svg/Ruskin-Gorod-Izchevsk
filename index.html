<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Русский Город Ижевск - 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        #info {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
            font-size: 1.2rem;
            padding: 5px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 20;
        }
        .ctrl-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(30, 30, 40, 0.7);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: 0.1s ease;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.92);
            border-color: #ffaa00;
        }
        #forward { background: rgba(0, 180, 255, 0.6); }
        #back { background: rgba(255, 100, 100, 0.6); }
        #left { background: rgba(255, 200, 0, 0.6); }
        #right { background: rgba(0, 230, 150, 0.6); }
        @media (max-width: 600px) {
            .ctrl-btn { width: 60px; height: 60px; font-size: 24px; }
            #info { font-size: 1rem; }
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 30px;
            pointer-events: none;
            z-index: 15;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            font-weight: 100;
        }
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a2a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            z-index: 100;
            transition: opacity 0.8s;
        }
    </style>
</head>
<body>
    <div id="loading">🏗️ Загрузка Ижевска...</div>
    <div id="info">🏠 Русский Город Ижевск • Прогулка 3D</div>
    <div id="crosshair">+</div>
    <div id="controls">
        <div class="ctrl-group">
            <div class="ctrl-btn" id="left">◀</div>
            <div class="ctrl-btn" id="right">▶</div>
        </div>
        <div class="ctrl-group">
            <div class="ctrl-btn" id="forward">▲</div>
            <div class="ctrl-btn" id="back">▼</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.126.0/examples/jsm/controls/OrbitControls.js';

        // --- Инициализация ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Голубое небо

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 8); // Рост человека ~1.7
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- Освещение ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(10, 20, 5);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        const d = 20;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 30;
        scene.add(sunLight);
        
        const fillLight = new THREE.DirectionalLight(0xccddff, 0.4);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);
        
        const backLight = new THREE.DirectionalLight(0xffccaa, 0.3);
        backLight.position.set(-5, 0, 10);
        scene.add(backLight);

        // --- Земля (газон) ---
        const groundGeometry = new THREE.PlaneGeometry(30, 30);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x4c8c4c, 
            roughness: 0.8,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Дороги (простая сетка) ---
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.9 });
        const roadPositions = [
            { x: 0, z: -3, w: 6, h: 0.5 },
            { x: 0, z: 3, w: 6, h: 0.5 },
            { x: -3, z: 0, w: 0.5, h: 6 },
            { x: 3, z: 0, w: 0.5, h: 6 }
        ];
        roadPositions.forEach(r => {
            const road = new THREE.Mesh(new THREE.PlaneGeometry(r.w, r.h), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(r.x, 0.001, r.z);
            road.receiveShadow = true;
            scene.add(road);
        });

        // --- Функция создания домика в стиле "Ижевск" (русский деревянный/кирпичный стиль) ---
        function createHouse(x, z, color = 0xcc8844, roofColor = 0x8b3a3a, width = 1.2, depth = 1.2, height = 1.0) {
            const group = new THREE.Group();

            // Стены (кирпичные/деревянные)
            const wallMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
            const wall = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), wallMat);
            wall.position.y = height/2;
            wall.castShadow = true;
            wall.receiveShadow = true;
            group.add(wall);

            // Крыша (двускатная)
            const roofShape = new THREE.Shape();
            const w2 = width/2 + 0.2;
            const hRoof = height * 0.6;
            roofShape.moveTo(-w2, 0);
            roofShape.lineTo(0, hRoof);
            roofShape.lineTo(w2, 0);
            roofShape.lineTo(-w2, 0);
            
            const extrudeSettings = { depth: depth + 0.2, bevelEnabled: false };
            const roofGeom = new THREE.ExtrudeGeometry(roofShape, extrudeSettings);
            const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.8 });
            const roof = new THREE.Mesh(roofGeom, roofMat);
            roof.position.set(0, height, -depth/2 - 0.1);
            roof.castShadow = true;
            roof.receiveShadow = true;
            group.add(roof);

            // Труба (для колорита)
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0x884444 });
            const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.4), pipeMat);
            pipe.position.set(0.3, height + 0.2, 0.2);
            pipe.castShadow = true;
            group.add(pipe);

            // Окна (декоративные)
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x224466, emissiveIntensity: 0.2 });
            const winFrame = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.25, 0.02), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            // Переднее окно
            const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.35, 0.05), windowMat);
            win1.position.set(0, height*0.65, depth/2 + 0.01);
            group.add(win1);
            // Боковое окно
            const win2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.35, 0.05), windowMat);
            win2.position.set(width/2 + 0.01, height*0.65, 0);
            win2.rotation.y = Math.PI/2;
            group.add(win2);

            // Крыльцо (ступеньки)
            const stepMat = new THREE.MeshStandardMaterial({ color: 0x8b6b4b });
            const step = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.3), stepMat);
            step.position.set(0, 0.04, depth/2 + 0.15);
            step.castShadow = true;
            step.receiveShadow = true;
            group.add(step);

            group.position.set(x, 0, z);
            // Небольшой случайный поворот для разнообразия
            group.rotation.y = Math.random() * 0.5 - 0.25;
            return group;
        }

        // --- Создаём город Ижевск (домики) ---
        const houseColors = [0xcc8844, 0xaa7744, 0xbb9966, 0x8b6b4b, 0x996633, 0xad8a5a];
        const roofColors = [0x8b3a3a, 0x6b2a2a, 0x9b4a4a, 0x7a3a3a, 0x5a2a2a];
        
        // Центральная площадь с домиками
        const positions = [
            [-2.5, -2.5], [2.5, -2.5], [-2.5, 2.5], [2.5, 2.5],
            [-4.5, -1], [4.5, -1], [-4.5, 1], [4.5, 1],
            [-1, -4.5], [1, -4.5], [-1, 4.5], [1, 4.5],
            [-6, -3], [6, -3], [-6, 3], [6, 3],
            [-3.5, -5.5], [3.5, -5.5], [-3.5, 5.5], [3.5, 5.5],
            [0, -6.5], [0, 6.5], [-6.5, 0], [6.5, 0]
        ];

        positions.forEach(([x, z]) => {
            const color = houseColors[Math.floor(Math.random() * houseColors.length)];
            const roofColor = roofColors[Math.floor(Math.random() * roofColors.length)];
            const w = 0.8 + Math.random() * 0.8;
            const d = 0.8 + Math.random() * 0.8;
            const h = 0.7 + Math.random() * 0.6;
            const house = createHouse(x, z, color, roofColor, w, d, h);
            scene.add(house);
        });

        // Дополнительные домики вдоль дорог
        for (let i = 0; i < 12; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 7 + Math.random() * 3;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const color = houseColors[Math.floor(Math.random() * houseColors.length)];
            const roofColor = roofColors[Math.floor(Math.random() * roofColors.length)];
            const house = createHouse(x, z, color, roofColor, 1.0 + Math.random()*0.6, 1.0 + Math.random()*0.6, 0.8 + Math.random()*0.5);
            scene.add(house);
        }

        // --- Деревья (берёзки/ёлочки) ---
        function createTree(x, z) {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b6b4b });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.5), trunkMat);
            trunk.position.y = 0.25;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            group.add(trunk);

            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d7d2d });
            const leaf1 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 6), leafMat);
            leaf1.position.y = 0.6;
            leaf1.castShadow = true;
            leaf1.receiveShadow = true;
            group.add(leaf1);
            
            const leaf2 = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6), leafMat);
            leaf2.position.y = 0.85;
            leaf2.castShadow = true;
            leaf2.receiveShadow = true;
            group.add(leaf2);

            group.position.set(x, 0, z);
            return group;
        }

        for (let i = 0; i < 40; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 2 + Math.random() * 8;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            // Не ставить деревья на дороги
            if (Math.abs(x) < 1.5 && Math.abs(z) < 1.5) continue;
            if (Math.abs(x) < 0.8 || Math.abs(z) < 0.8) continue;
            const tree = createTree(x, z);
            scene.add(tree);
        }

        // --- Небольшой заборчик (декорация) ---
        function createFence(x, z, angle) {
            const group = new THREE.Group();
            const postMat = new THREE.MeshStandardMaterial({ color: 0xccbbaa });
            const plankMat = new THREE.MeshStandardMaterial({ color: 0xddccbb });
            for (let i = -1; i <= 1; i+=0.5) {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.3), postMat);
                post.position.set(i*0.5, 0.15, 0);
                post.castShadow = true;
                group.add(post);
            }
            const plank = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.04, 0.02), plankMat);
            plank.position.set(0, 0.2, 0);
            plank.castShadow = true;
            group.add(plank);
            const plank2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.04, 0.02), plankMat);
            plank2.position.set(0, 0.1, 0);
            plank2.castShadow = true;
            group.add(plank2);
            
            group.position.set(x, 0, z);
            group.rotation.y = angle;
            return group;
        }

        // --- Управление с клавиатуры и кнопок ---
        const keyState = { forward: false, back: false, left: false, right: false };
        const moveSpeed = 0.12;
        const rotationSpeed = 0.04;

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': keyState.forward = true; e.preventDefault(); break;
                case 'ArrowDown': keyState.back = true; e.preventDefault(); break;
                case 'ArrowLeft': keyState.left = true; e.preventDefault(); break;
                case 'ArrowRight': keyState.right = true; e.preventDefault(); break;
                case 'w': keyState.forward = true; e.preventDefault(); break;
                case 's': keyState.back = true; e.preventDefault(); break;
                case 'a': keyState.left = true; e.preventDefault(); break;
                case 'd': keyState.right = true; e.preventDefault(); break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowUp': keyState.forward = false; e.preventDefault(); break;
                case 'ArrowDown': keyState.back = false; e.preventDefault(); break;
                case 'ArrowLeft': keyState.left = false; e.preventDefault(); break;
                case 'ArrowRight': keyState.right = false; e.preventDefault(); break;
                case 'w': keyState.forward = false; e.preventDefault(); break;
                case 's': keyState.back = false; e.preventDefault(); break;
                case 'a': keyState.left = false; e.preventDefault(); break;
                case 'd': keyState.right = false; e.preventDefault(); break;
            }
        });

        // Кнопки для iPad
        document.getElementById('forward').addEventListener('touchstart', (e) => { e.preventDefault(); keyState.forward = true; });
        document.getElementById('forward').addEventListener('touchend', (e) => { e.preventDefault(); keyState.forward = false; });
        document.getElementById('back').addEventListener('touchstart', (e) => { e.preventDefault(); keyState.back = true; });
        document.getElementById('back').addEventListener('touchend', (e) => { e.preventDefault(); keyState.back = false; });
        document.getElementById('left').addEventListener('touchstart', (e) => { e.preventDefault(); keyState.left = true; });
        document.getElementById('left').addEventListener('touchend', (e) => { e.preventDefault(); keyState.left = false; });
        document.getElementById('right').addEventListener('touchstart', (e) => { e.preventDefault(); keyState.right = true; });
        document.getElementById('right').addEventListener('touchend', (e) => { e.preventDefault(); keyState.right = false; });

        // Адаптация под окно
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Основной цикл ---
        function animate() {
            requestAnimationFrame(animate);

            // Движение и поворот
            if (keyState.forward) {
                camera.position.x += Math.sin(camera.rotation.y) * moveSpeed;
                camera.position.z += Math.cos(camera.rotation.y) * moveSpeed;
            }
            if (keyState.back) {
                camera.position.x -= Math.sin(camera.rotation.y) * moveSpeed;
                camera.position.z -= Math.cos(camera.rotation.y) * moveSpeed;
            }
            if (keyState.left) {
                camera.rotation.y += rotationSpeed;
            }
            if (keyState.right) {
                camera.rotation.y -= rotationSpeed;
            }

            // Простая коллизия (не выходить за границы)
            const limit = 9;
            camera.position.x = Math.max(-limit, Math.min(limit, camera.position.x));
            camera.position.z = Math.max(-limit, Math.min(limit, camera.position.z));

            renderer.render(scene, camera);
        }

        // Скрыть загрузку
        setTimeout(() => {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 800);
        }, 500);

        animate();
    </script>
</body>
</html>
